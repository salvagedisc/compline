name: dev

# Every push to main refreshes the rolling "dev" pre-release with the .mrpack of the latest main,
# so it can be played without asking for an export (docs/dev-sync.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev
  cancel-in-progress: true

jobs:
  mrpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e

      - name: Export .mrpack
        working-directory: pack
        run: |
          mkdir -p ../dist
          packwiz mr export -o ../dist/Compline-dev.mrpack

      - name: Update the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Latest main: ${GITHUB_SHA::7} ($(git log -1 --format=%cs)). $(git log -1 --format=%s)"
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/Compline-dev.mrpack --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Compline dev (${GITHUB_SHA::7})" --notes "$notes"

