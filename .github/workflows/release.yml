name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e

      # vX.Y.Z: release, notes from the [X.Y.Z] section of the changelog.
      # vX.Y.Z-alpha.N (or -beta.N): test build of the coming X.Y.Z, notes listing
      # the pull requests merged since the previous tag; pack.toml keeps X.Y.Z.
      - name: Check tag matches pack version
        id: meta
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' pack/pack.toml)
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            "$base")
              pre=false
              awk -v h="## [${version}]" 'index($0, h) == 1 {f=1; next} index($0, "## [") == 1 {f=0} f' CHANGELOG.md > notes.md
              [ -s notes.md ] || { echo "::error::section [${version}] absente du CHANGELOG"; exit 1; } ;;
            "$base"-alpha.*|"$base"-beta.*)
              pre=true
              prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
              if [ -z "$prev" ]; then
                echo "First test build of the coming ${base}, for the people testing the pack." > notes.md
              else {
                echo "Test build of the coming ${base}, for the people testing the pack. Merged since ${prev}:"
                echo
                git log --first-parent --merges --format='%b%x1e' ${prev:+${prev}..}HEAD \
                  | awk 'BEGIN { RS = "\036" } { sub(/^\n+/, ""); split($0, l, "\n"); if (l[1] != "") print "- " l[1] }' | head -n 200
              } > notes.md; fi
              sed -i "s/^version = \".*\"/version = \"${version}\"/" pack/pack.toml ;;
            *) echo "::error::tag ${GITHUB_REF_NAME} ≠ pack.toml ${base}"; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "pre=${pre}" >> "$GITHUB_OUTPUT"

      - name: Export .mrpack
        working-directory: pack
        run: |
          mkdir -p ../dist
          packwiz mr export -o "../dist/Fallow-${{ steps.meta.outputs.version }}.mrpack"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "${{ steps.meta.outputs.pre }}" = true ] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" dist/*.mrpack --title "Fallow ${{ steps.meta.outputs.version }}" --notes-file notes.md "${flags[@]}"

      # Runs once the MODRINTH_PROJECT_ID variable and the MODRINTH_TOKEN secret exist (set by the
      # owner). While the project is a draft, the versions are only visible to its members.
      # https://docs.modrinth.com/api/operations/createversion/
      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        run: |
          version="${{ steps.meta.outputs.version }}"
          case "$version" in *-alpha.*) type=alpha ;; *-beta.*|0.*) type=beta ;; *) type=release ;; esac
          featured=true; [ "${{ steps.meta.outputs.pre }}" = true ] && featured=false
          data=$(jq -n --arg p "$MODRINTH_PROJECT_ID" --arg v "$version" --arg t "$type" --argjson f "$featured" --rawfile c notes.md \
            '{project_id:$p, name:("Fallow " + $v), version_number:$v, changelog:$c, version_type:$t,
              game_versions:["1.21.1"], loaders:["neoforge"], dependencies:[], featured:$f,
              file_parts:["file"], primary_file:"file"}')
          curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: salvagedisc/fallow release" \
            --form-string "data=${data}" \
            -F "file=@dist/Fallow-${version}.mrpack;type=application/x-modrinth-modpack+zip"
