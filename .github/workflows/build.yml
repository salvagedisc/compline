name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - uses: actions/cache@v4
        with:
          path: .cache/jars
          key: jars-${{ hashFiles('pack/mods/*.pw.toml') }}
          restore-keys: jars-
      - name: Check real mod dependencies
        run: npm run check-deps
      - name: Check French translations
        run: npm run check-fr

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e

      - name: Check index is up to date
        working-directory: pack
        run: |
          packwiz refresh
          git diff --exit-code -- . || { echo "::error::index.toml pas à jour : lancer 'packwiz refresh' dans pack/"; exit 1; }

      - name: Export .mrpack
        id: export
        working-directory: pack
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pack.toml)
          name="Compline-${version}-${GITHUB_SHA::7}"
          mkdir -p ../dist
          packwiz mr export -o "../dist/${name}.mrpack"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        # A full artifact storage quota must not hide a good build.
        continue-on-error: true
        with:
          name: ${{ steps.export.outputs.name }}
          path: dist/*.mrpack
          # Each pack is ~45 MB: keep the storage quota of a private repo free.
          retention-days: 3

  # Le mod custom compline (mods-custom/compline/) doit toujours compiler.
  mod-compline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            mods-custom/compline/*.gradle
            mods-custom/compline/gradle.properties
            mods-custom/compline/gradle/wrapper/gradle-wrapper.properties
            pack/mods/*.pw.toml

      - name: Build compline mod
        working-directory: mods-custom/compline
        run: ./gradlew build --console=plain

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: compline-mod-${{ github.sha }}
          path: mods-custom/compline/build/libs/*.jar
          retention-days: 3

  # Démarre un serveur dédié avec tout le pack (côté serveur) et le mod compline de cette branche :
  # échoue sur un plantage, une erreur des journaux non listée dans scripts/boot/known-errors.txt,
  # ou un objet inconnu dans les listes KubeJS.
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            mods-custom/compline/*.gradle
            mods-custom/compline/gradle.properties
            mods-custom/compline/gradle/wrapper/gradle-wrapper.properties
            pack/mods/*.pw.toml

      - uses: actions/cache@v4
        with:
          path: .cache/jars
          key: jars-${{ hashFiles('pack/mods/*.pw.toml') }}
          restore-keys: jars-

      - uses: actions/cache@v4
        with:
          path: |
            .cache/server/libraries
            .cache/neoforge-*-installer.jar
          key: neoforge-server-${{ hashFiles('pack/pack.toml') }}
          restore-keys: neoforge-server-

      - name: Build compline mod
        working-directory: mods-custom/compline
        run: ./gradlew build --console=plain

      - name: Boot the pack on a dedicated server
        run: node scripts/boot/server.mjs --jar "$(ls mods-custom/compline/build/libs/compline-*.jar | grep -v sources | head -1)"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: boot-logs-${{ github.sha }}
          path: |
            .cache/server/logs/
            .cache/server/crash-reports/
          retention-days: 3
