# Brumaire : réglages d'Iris.

# L'occlusion du jeu arrive à part (alpha des sommets) et le jeu n'assombrit plus lui-même les faces.
separateAo=true
oldLighting=false
underwaterOverlay=false
vignette=false
rain.depth=false
beacon.beam.depth=true
dhShadow.enabled=false

# Fonctions d'Iris demandées : images et programmes de calcul (la table du ciel).
iris.features.required = CUSTOM_IMAGES COMPUTE_SHADERS

# La table du ciel (prepare.csh), relue par tous les programmes sous le nom skyTex.
image.skyImg = skyTex RGBA RGBA16F HALF_FLOAT false false 192 109

# La lumière colorée (lib/voxel.glsl) : les blocs autour de la caméra, rangés par la passe d'ombre, et la lumière
# répandue de proche en proche par shadowcomp, une image sur deux dans A, l'autre dans B.
image.voxelImg = voxelTex RED_INTEGER R32UI UNSIGNED_INT true false 128 64 128
image.lightImgA = lightTexA RGBA RGBA16F HALF_FLOAT false false 128 64 128
image.lightImgB = lightTexB RGBA RGBA16F HALF_FLOAT false false 128 64 128
program.shadowcomp.enabled = COLORED_LIGHT
# L'abri de la pluie dessinée par le shader (shadowcomp1), tiré du même volume.
image.shelterImg = shelterTex RED R16F HALF_FLOAT false false 128 128
program.shadowcomp1.enabled = SHADER_RAIN

# Les traces de pas (lib/tracks.glsl) : la carte des empreintes, et où chaque être proche a posé le dernier pied.
image.trackImg = trackTex RGBA RGBA16F HALF_FLOAT false false 1024 1024
image.trackStateImg = trackStateTex RGBA RGBA32F FLOAT false false 4 1
program.prepare1.enabled = TRACKS

# Le bruit des nuages (setup.csh), en trois dimensions, relu sous le nom cloudNoiseTex.
image.cloudNoiseImg = cloudNoiseTex RG RG8 UNSIGNED_BYTE false false 64 64 64

# L'air du biome où se tient le joueur, lissé sur une dizaine de secondes.
uniform.float.airHumid = smooth(clamp(rainfall, 0.0, 1.0), 8.0, 8.0)
uniform.float.airHeat = smooth(clamp(temperature, -0.5, 2.0), 8.0, 8.0)
# Il pleut là où se tient le joueur (ni neige ni désert), lissé sur quelques secondes : sol mouillé, rideaux de pluie.
uniform.float.rainHere = smooth(if(biome_precipitation == 1, 1.0, 0.0), 4.0, 4.0)
# Il neige là où se tient le joueur : neige sur les arbres et les rebords.
uniform.float.snowHere = smooth(if(biome_precipitation == 2, 1.0, 0.0), 10.0, 10.0)

# Les tables de l'anticrénelage SMAA (licence MIT, textures/SMAA-LICENSE.txt), relues par composite4.
customTexture.smaaArea = textures/smaa_area.png
customTexture.smaaSearch = textures/smaa_search.png

# L'occlusion d'écran se calcule sur un demi-écran.
scale.deferred = 0.5
# Les nuages aussi.
scale.composite = 0.5
# La couche des surfaces (normale, part de lumière indirecte) ne se mélange jamais.
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_entities.colortex1 = off
# deferred1 copie la scène opaque dans colortex6 : l'eau y lit ce qu'elle laisse voir et ce qu'elle reflète.

# Profils : du plus léger au plus beau.
profile.TRES_LEGER=shadowMapResolution=1024 shadowDistance=64.0 SHADOW_FILTER=1 LIGHT_SHAFTS=0 !BLOOM AO_SAMPLES=0 CLOUD_STEPS=0 WATER_REFLECTIONS=0 WATER_CAUSTICS=0 WET_REFLECTIONS=0 RAIN_CURTAINS=0.0 HEAT_SHIMMER=0 SMAA=0 COLORED_LIGHT=0 SHADER_RAIN=0 WATER_MOTES=0 AIR_MOTES=0
profile.LEGER=shadowMapResolution=1024 shadowDistance=80.0 SHADOW_FILTER=4 LIGHT_SHAFTS=0 !BLOOM AO_SAMPLES=0 CLOUD_STEPS=10 WATER_REFLECTIONS=12 WATER_CAUSTICS=1 WET_REFLECTIONS=8 RAIN_CURTAINS=1.0 HEAT_SHIMMER=1 SMAA=1 COLORED_LIGHT=1 SHADER_RAIN=1 WATER_MOTES=1 AIR_MOTES=1
profile.EQUILIBRE=shadowMapResolution=2048 shadowDistance=112.0 SHADOW_FILTER=8 LIGHT_SHAFTS=10 BLOOM AO_SAMPLES=10 CLOUD_STEPS=16 WATER_REFLECTIONS=20 WATER_CAUSTICS=2 WET_REFLECTIONS=12 RAIN_CURTAINS=1.0 HEAT_SHIMMER=1 SMAA=2 COLORED_LIGHT=1 SHADER_RAIN=1 WATER_MOTES=1 AIR_MOTES=1
profile.BEAU=shadowMapResolution=3072 shadowDistance=160.0 SHADOW_FILTER=12 LIGHT_SHAFTS=16 BLOOM AO_SAMPLES=16 CLOUD_STEPS=24 WATER_REFLECTIONS=32 WATER_CAUSTICS=2 WET_REFLECTIONS=20 RAIN_CURTAINS=1.0 HEAT_SHIMMER=1 SMAA=3 COLORED_LIGHT=1 SHADER_RAIN=1 WATER_MOTES=1 AIR_MOTES=1

screen=<profile> SMAA [MIST] [CLOUDS] [LIGHT] [WATER] [RAIN] [NATURE] [COLOR]
screen.CLOUDS=CLOUD_STEPS CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_SPEED CLOUD_LIGHT CLOUD_RANGE CLOUD_SHADOWS
screen.MIST=MIST_DENSITY MIST_HEIGHT MIST_LIFT MIST_RING MIST_RING_MAX AIR_DENSITY
screen.LIGHT=shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS sunPathRotation LIGHT_SHAFTS SHAFT_STRENGTH BLOOM BLOOM_STRENGTH AO_SAMPLES AO_RADIUS AO_STRENGTH COLORED_LIGHT AIR_MOTES
screen.WATER=WATER_WAVES WATER_MURK WATER_REFLECTIONS WATER_CAUSTICS WATER_PIXELS WATER_MOTES
screen.RAIN=SHADER_RAIN WETNESS PUDDLES PUDDLE_AMOUNT WET_REFLECTIONS RAIN_CURTAINS <empty> SNOW_COVER HEAT_SHIMMER TRACKS TRACK_MINUTES
screen.NATURE=WIND_STRENGTH FROST
screen.COLOR=OLIVE SATURATION CONTRAST EXPOSURE

sliders=CLOUD_STEPS CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_SPEED CLOUD_LIGHT CLOUD_RANGE CLOUD_SHADOWS SHADOW_SOFTNESS AO_SAMPLES AO_RADIUS AO_STRENGTH MIST_DENSITY MIST_HEIGHT MIST_LIFT MIST_RING MIST_RING_MAX AIR_DENSITY shadowMapResolution shadowDistance SHADOW_FILTER sunPathRotation LIGHT_SHAFTS SHAFT_STRENGTH BLOOM_STRENGTH WIND_STRENGTH WATER_WAVES WATER_MURK WATER_REFLECTIONS WETNESS PUDDLE_AMOUNT WET_REFLECTIONS RAIN_CURTAINS OLIVE SATURATION CONTRAST EXPOSURE TRACK_MINUTES
