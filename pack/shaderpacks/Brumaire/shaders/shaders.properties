# Brumaire : réglages d'Iris.

# L'occlusion du jeu arrive à part (alpha des sommets) et le jeu n'assombrit plus lui-même les faces.
separateAo=true
oldLighting=false
underwaterOverlay=false
vignette=false
rain.depth=false
beacon.beam.depth=true
dhShadow.enabled=false

# Profils : du plus léger au plus beau.
profile.LEGER=shadowMapResolution=1024 shadowDistance=80.0 SHADOW_FILTER=4 LIGHT_SHAFTS=0 !BLOOM
profile.EQUILIBRE=shadowMapResolution=2048 shadowDistance=112.0 SHADOW_FILTER=6 LIGHT_SHAFTS=10 BLOOM
profile.BEAU=shadowMapResolution=3072 shadowDistance=160.0 SHADOW_FILTER=9 LIGHT_SHAFTS=16 BLOOM

screen=<profile> <empty> [MIST] [LIGHT] [NATURE] [COLOR]
screen.MIST=MIST_DENSITY MIST_HEIGHT MIST_LIFT MIST_RING MIST_RING_MAX
screen.LIGHT=shadowMapResolution shadowDistance SHADOW_FILTER sunPathRotation LIGHT_SHAFTS SHAFT_STRENGTH BLOOM BLOOM_STRENGTH
screen.NATURE=WIND_STRENGTH WATER_WAVES
screen.COLOR=OLIVE SATURATION CONTRAST EXPOSURE

sliders=MIST_DENSITY MIST_HEIGHT MIST_LIFT MIST_RING MIST_RING_MAX shadowMapResolution shadowDistance SHADOW_FILTER sunPathRotation LIGHT_SHAFTS SHAFT_STRENGTH BLOOM_STRENGTH WIND_STRENGTH WATER_WAVES OLIVE SATURATION CONTRAST EXPOSURE
