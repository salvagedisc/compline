# Brumaire : réglages d'Iris.

# L'occlusion du jeu arrive à part (alpha des sommets) et le jeu n'assombrit plus lui-même les faces.
separateAo=true
oldLighting=false
underwaterOverlay=false
vignette=false
rain.depth=false
beacon.beam.depth=true
dhShadow.enabled=false

# Fonctions d'Iris demandées : images et programmes de calcul (la table du ciel).
iris.features.required = CUSTOM_IMAGES COMPUTE_SHADERS

# La table du ciel (prepare.csh), relue par tous les programmes sous le nom skyTex.
image.skyImg = skyTex RGBA RGBA16F HALF_FLOAT false false 192 109

# Le bruit des nuages (setup.csh), en trois dimensions, relu sous le nom cloudNoiseTex.
image.cloudNoiseImg = cloudNoiseTex RG RG8 UNSIGNED_BYTE false false 64 64 64

# L'air du biome où se tient le joueur, lissé sur une dizaine de secondes.
uniform.float.airHumid = smooth(clamp(rainfall, 0.0, 1.0), 8.0, 8.0)
uniform.float.airHeat = smooth(clamp(temperature, -0.5, 2.0), 8.0, 8.0)

# L'occlusion d'écran se calcule sur un demi-écran.
scale.deferred = 0.5
# Les nuages aussi.
scale.composite = 0.5
# La couche des surfaces (normale, part de lumière indirecte) ne se mélange jamais.
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_entities.colortex1 = off

# Profils : du plus léger au plus beau.
profile.LEGER=shadowMapResolution=1024 shadowDistance=80.0 SHADOW_FILTER=4 LIGHT_SHAFTS=0 !BLOOM AO_SAMPLES=0 CLOUD_STEPS=10
profile.EQUILIBRE=shadowMapResolution=2048 shadowDistance=112.0 SHADOW_FILTER=8 LIGHT_SHAFTS=10 BLOOM AO_SAMPLES=10 CLOUD_STEPS=16
profile.BEAU=shadowMapResolution=3072 shadowDistance=160.0 SHADOW_FILTER=12 LIGHT_SHAFTS=16 BLOOM AO_SAMPLES=16 CLOUD_STEPS=24

screen=<profile> <empty> [MIST] [CLOUDS] [LIGHT] [NATURE] [COLOR]
screen.CLOUDS=CLOUD_STEPS CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_SPEED CLOUD_LIGHT CLOUD_RANGE CLOUD_SHADOWS
screen.MIST=MIST_DENSITY MIST_HEIGHT MIST_LIFT MIST_RING MIST_RING_MAX AIR_DENSITY
screen.LIGHT=shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS sunPathRotation LIGHT_SHAFTS SHAFT_STRENGTH BLOOM BLOOM_STRENGTH AO_SAMPLES AO_RADIUS AO_STRENGTH
screen.NATURE=WIND_STRENGTH WATER_WAVES
screen.COLOR=OLIVE SATURATION CONTRAST EXPOSURE

sliders=CLOUD_STEPS CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_SPEED CLOUD_LIGHT CLOUD_RANGE CLOUD_SHADOWS SHADOW_SOFTNESS AO_SAMPLES AO_RADIUS AO_STRENGTH MIST_DENSITY MIST_HEIGHT MIST_LIFT MIST_RING MIST_RING_MAX AIR_DENSITY shadowMapResolution shadowDistance SHADOW_FILTER sunPathRotation LIGHT_SHAFTS SHAFT_STRENGTH BLOOM_STRENGTH WIND_STRENGTH WATER_WAVES OLIVE SATURATION CONTRAST EXPOSURE
