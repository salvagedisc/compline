# Matières lues par le shader (10000 + numéro).
# 1 : plantes en croix, le haut ondule. 2 et 3 : plantes hautes, moitié basse et moitié haute.
# 4 : feuillages. 5 : lianes et plantes pendantes. 6 : eau. 8 : blocs qui éclairent.
# 9 : neige. 10 : glace translucide. 11 : glace tassée et glace bleue. 12 : sable.
# 13 : verre, 14 : blocs partiels (dalles, escaliers, barrières…) : la lumière colorée les traverse.
# 8 et 16 à 22 : blocs qui éclairent, par couleur de lumière (lib/voxel.glsl) : 8 flamme, 16 âmes, 17 lave,
# 18 jaune chaud, 19 blanc bleuté, 20 vert, 21 violet, 22 redstone.

