# Tilth: no announcement bell, update notice or developer news from Adorable
# Hamster Pets. The server switch overrides every client; the client switches
# also hide the bell on the HUD and in inventories. The mod fills in its other
# defaults on first launch.
version = 0
serverDisableAnnouncements = true
enableNotificationIcons = false
enableHudIcon = false
enableWidgetIcon = false
