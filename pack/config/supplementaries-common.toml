# Compline — Supplementaries réduit à l'essentiel (voir docs/decisions/0006-supplementaries.md).
# Fichier partiel : les options absentes gardent leur valeur par défaut.

[general]
	creative_tab = false
	#Le Red Merchant vend des bombes : désactivé
	red_merchant_spawn_multiplier = 0.0

[redstone]
	[redstone.speaker_block]
		enabled = false
	[redstone.bellows]
		enabled = true
	[redstone.spring_launcher]
		enabled = false
	[redstone.enderman_head]
		enabled = false
	[redstone.turn_table]
		enabled = true
	[redstone.pulley_block]
		enabled = true
	[redstone.dispenser_minecart]
		enabled = false
	[redstone.faucet]
		enabled = true
	[redstone.crystal_display]
		enabled = false

[functional]
	[functional.rope]
		enabled = true
	[functional.jar]
		enabled = true
	[functional.cage]
		enabled = true
	[functional.safe]
		enabled = true
	#Un seul sac dans le pack : celui de Reliable Backpacks (décision 0012)
	[functional.sack]
		enabled = false
	[functional.bamboo_spikes]
		enabled = false
	[functional.urn]
		enabled = true
		cave_urns = true
	[functional.soap]
		enabled = true
	[functional.cannon]
		enabled = false
		[functional.cannon.cannonball]
			enabled = false
		[functional.cannon.cannon_boat]
			enabled = false
		[functional.cannon.plunderer]
			enabled = false
			#Pas de galion à pillards en mer
			galleon = false
	[functional.present]
		enabled = true
	[functional.flax]
		enabled = true
		wild_flax = true
	[functional.lumisene]
		enabled = false
		[functional.lumisene.lumisene_bottle]
			enabled = false

[building]
	#Crêpes sans cuisson : la cuisine passe par Kaleidoscope Cookery
	pancake = false
	[building.sconce]
		enabled = true
	[building.blackboard]
		enabled = true
	#Briques de gravier : Twigs a les mêmes
	[building.gravel_bricks]
		enabled = false
	[building.slidy_block]
		enabled = false
	[building.timber_frame]
		enabled = true
	[building.iron_gate]
		enabled = true
	[building.item_shelf]
		enabled = true
	[building.sugar_cube]
		enabled = false
	[building.planter]
		enabled = true
	[building.notice_board]
		enabled = true
	[building.pedestal]
		enabled = true
	[building.ash]
		enabled = true
	[building.flag]
		enabled = true
	[building.goblet]
		enabled = true
	[building.globe]
		enabled = true
		#Jamais de coordonnées
		show_coordinates = false
	[building.way_sign]
		enabled = true
		[building.way_sign.road_signs]
			#Pas de panneaux générés pointant vers les structures : les routes sont l'affaire des joueurs
			enabled = false
	[building.daub]
		enabled = true
	[building.ash_bricks]
		enabled = true
	[building.hat_stand]
		enabled = true
	[building.awning]
		enabled = true
