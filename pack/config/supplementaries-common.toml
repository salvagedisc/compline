	[building.netherite_doors]
		door = false
		trapdoor = false

[tools]
	#Ni altitude en chiffres ni bonbons sans cuisine
	altimeter = false
	candy = false
	[tools.quiver]
		enabled = true
	[tools.lunch_basket]
		enabled = true
	#Carte en tranches : un radar de grottes, contraire à l'exploration
	[tools.slice_map]
		enabled = false
	[tools.bubble_blower]
		enabled = false
	[tools.wrench]
		enabled = false
	[tools.rope_arrow]
		enabled = true
		#Une flèche à corde emporte 8 cordes au plus (32 par défaut) : le lin reste une ressource
		capacity = 8
	[tools.flute]
		enabled = true
		#La flûte ramène un animal lié de 24 blocs au plus (64 par défaut)
		bound_distance = 24
	[tools.bomb]
		enabled = false
	[tools.slingshot]
		enabled = false
	[tools.antique_ink]
		enabled = true

