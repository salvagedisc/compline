# Compline : ce qu'Every Compat n'enregistre pas du tout (voir docs/plan/tri-du-pack.md).
# Fichier « hazardous » : il change le registre. Client et serveur doivent avoir le même,
# et il ne doit plus changer une fois le monde permanent créé (un bloc retiré deviendrait de l'air).
# Rouvrir une entrée plus tard est sans risque ; en fermer une ne l'est pas.
[woodtype]
	# Bois fantômes de Quark (modules coupés) et bois hanté de Ghost
	blacklist = ["quark:.*", "ghosts:haunted"]
[leavestype]
	blacklist = ["quark:.*", "ghosts:.*"]
[block]
	blacklist = []
[entryset]
	blacklist = []
[module]
	# Les tables de Twigs doublent celles de Handcrafted
	blacklist = ["twigs"]
[other]
	include_all_wood_modules = true
