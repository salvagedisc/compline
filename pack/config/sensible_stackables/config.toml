# Fallow: stack sizes by kind of item (decision 0012). Every item that stacked to 64
# now stacks to 32; the fallow:pile/N tags (pack/kubejs/data/fallow/tags/item/pile/)
# set the exceptions. Items with durability are never touched. Keep every stack at
# least as large as the biggest recipe output of that item.
# File name and layout inferred from the jar (Fzzy Config): compare with the file
# generated on first launch.
version = 0
splashPotionCooldown = 0
uncapStackSize = false
commonStackSize = 32

[items]
"#fallow:pile/64" = 64
"#fallow:pile/16" = 16
"#fallow:pile/8" = 8
"#fallow:pile/4" = 4
