# Tilth: 30 minutes of day, 15 minutes of night (decision 0012).
# Day runs from dayStart to nightStart (13000 ticks), night the other 11000.
# RATIO = ticks of game time per tick: 13000 / (30 x 1200) and 11000 / (15 x 1200).
# For 60 / 30: daySpeed = 0.1806, nightSpeed = 0.3056 (and LastingDaysOfEachTerm = 2
# in eclipticseasons-common.toml).
# Only the clock moves: crops, furnaces and Create keep their vanilla pace.
[time]
	speedMethod = "RATIO"
	daySpeed = 0.3611
	nightSpeed = 0.6111
	dayStart = 23500.0
	nightStart = 12500.0

	[time.effects]
		blockEntityEffect = "NEVER"
		potionEffect = "NEVER"
		hungerEffect = "NEVER"
		weatherEffect = "SLEEPING"
		randomTickEffect = "NEVER"

# Vanilla sleep is kept; Better Days' own sleep is off.
[sleep]
	enableSleepFeature = false
