# Fallow : réglages serveur de Traveler's Backpack appliqués à chaque nouveau monde.
# Seules les clés changées sont écrites ; NeoForge complète le reste avec les valeurs par défaut.
# Voir docs/plan/xp.md : le sac en lapis (qui doublait l'XP ramassée) n'a plus de capacité.
# La liste est celle du mod (10.1.39), sans travelersbackpack:lapis.

[server.backpackAbilities]
	#List of backpacks that are allowed to have an ability. DO NOT ADD anything to this list, because the game will crash, remove entries if backpack should not have ability
	allowedAbilities = ["travelersbackpack:netherite", "travelersbackpack:diamond", "travelersbackpack:gold", "travelersbackpack:emerald", "travelersbackpack:iron", "travelersbackpack:redstone", "travelersbackpack:bookshelf", "travelersbackpack:sponge", "travelersbackpack:cake", "travelersbackpack:cactus", "travelersbackpack:melon", "travelersbackpack:pumpkin", "travelersbackpack:creeper", "travelersbackpack:dragon", "travelersbackpack:enderman", "travelersbackpack:blaze", "travelersbackpack:ghast", "travelersbackpack:magma_cube", "travelersbackpack:spider", "travelersbackpack:wither", "travelersbackpack:warden", "travelersbackpack:bat", "travelersbackpack:bee", "travelersbackpack:ocelot", "travelersbackpack:cow", "travelersbackpack:chicken", "travelersbackpack:squid", "travelersbackpack:hay", "travelersbackpack:fox"]
